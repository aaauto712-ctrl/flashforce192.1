  <script>
    // The study-mode star is explicitly yellow when the current card is starred.
    function renderStudyCard() {
      if (studyCards.length === 0) return;

      const card = studyCards[studyIndex];
      const cardInner = document.getElementById('3d-card-inner');
      isFlipped = false;
      cardInner.classList.remove('rotate-y-180');

      const frontText = frontFirstMode ? card.front : card.back;
      const backText = frontFirstMode ? card.back : card.front;
      document.getElementById('study-card-front-text').innerHTML = frontText;
      document.getElementById('study-card-back-text').innerHTML = backText;

      const starIcon = document.getElementById('study-star-icon');
      starIcon.className = card.starred
        ? 'w-6 h-6 text-yellow-400 fill-yellow-400'
        : 'w-6 h-6 text-slate-300 dark:text-slate-600';
    }
  </script>
